<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Qingdao landmark geometry review</title><style>html,body{margin:0;background:#f5eedf;color:#655443;font:14px sans-serif}canvas{width:1200px;height:840px;display:block}#labels{position:absolute;inset:0;width:1200px;height:840px;pointer-events:none;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,280px)}#labels div{display:flex;align-items:end;justify-content:center;padding-bottom:14px;font-size:15px;letter-spacing:.03em}.caption{padding:15px 24px;font-size:14px}</style><canvas id="models"></canvas><div id="labels"></div><div class="caption">青岛 · Three.js 实际几何渲染 · 11 单体 / 10,108 三角面</div><script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';
import {createQingdaoLandmarks} from '/src/landmarks/qingdao.js';
const canvas=document.querySelector('canvas'),renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setSize(1200,840);renderer.setScissorTest(true);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.setClearColor('#f5eedf');

}window.__QINGDAO_PREVIEW_READY__=true;
</script></html>
